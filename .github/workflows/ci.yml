name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  test:
    name: Typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # The rate-limiter and distributed-quota tests need a real Redis (Lua + EVALSHA).
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    name: Compiled build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Boots dist/ (not tsx) with a mock upstream pair and checks routing, JWT rejection
      # and a 429 against the real Redis above. Uses generated test-only keys.
      - run: npm run smoke

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime dependencies: fail on moderate or higher. All dependencies (incl. dev
      # tooling): fail on high or higher.
      - run: npm run audit

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag api-gateway:ci .
      - name: Validate Compose file
        run: |
          # The services read .dev/gateway.env (generated locally, gitignored); an empty
          # placeholder is enough to validate the Compose file's structure.
          mkdir -p .dev && touch .dev/gateway.env
          docker compose config --quiet
